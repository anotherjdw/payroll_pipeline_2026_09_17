# ci.yml -- generated by pipeline-automator scaffold (project init)
# CI/CD for the payroll_pipeline_2026_09_17 data pipeline: pre-commit, lint, type-check, the full
# test suite (unit, integration, end_to_end, in one pytest invocation so the
# session-scoped Spark fixture is shared), a Terraform format/validate gate, a read-only
# `plan` on every push and pull request, and a `terraform apply` + shared-library/script
# deploy gated behind the GitHub `dev` Environment, on
# push to main only.
#
# Three repo secrets, each an IAM role ARN assumed via OIDC (no long-lived AWS keys) --
# provisioned by infra/terraform/bootstrap (see its README for the one-time admin apply):
#   secrets.AWS_PLAN_ROLE_ARN     -- read-only; assumed by `plan`.
#   secrets.AWS_DEPLOY_ROLE_ARN   -- creates/updates resources; assumed by `apply`.
#   secrets.AWS_SCRIPTS_ROLE_ARN  -- scripts-bucket write only; assumed by `deploy`.
# Plus one repo variable, `vars.AWS_REGION`, read by every assumed-role session.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_INPUT: "false"
  TF_CLI_ARGS: "-no-color"

jobs:
  quality:
    name: Lint, type-check & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java (required by PySpark)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Lint (ruff)
        run: ruff check src/

      - name: Type-check (mypy)
        run: mypy src/

      - name: Build shared library zip (packaging check)
        # Credential-free, no upload -- a broken package fails the PR here rather than
        # first being discovered by the `deploy` job on main. Excludes each job's own
        # entry-point script (uploaded separately, see `deploy` below) and __pycache__;
        # keeps every job's own __init__.py and *_transformations.py, since job.py
        # imports its transformations from inside jobs/<job>/ (see jobs/job.py.j2).
        run: |
          mkdir -p dist
          cd src && find payroll_pipeline_2026_09_17 -type f \
            ! -path "*/__pycache__/*" \
            ! -path "*/tests/*" \
            ! -path "*/jobs/*/*.yaml" \
            | grep -vE 'jobs/([^/]+)/\1\.py$' \
            | zip -q ../dist/payroll_pipeline_2026_09_17.zip -@

      - name: Tests (pytest -- unit, integration, end_to_end)
        run: pytest --cov=src --cov-report=term-missing

  terraform:
    name: Terraform format & validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: tf-setup
        uses: ./.github/actions/tf-setup
        with:
          backend: "false"

      - name: Terraform format check
        run: terraform fmt -check -recursive infra/terraform/

      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: [quality, terraform]
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: tf-setup
        uses: ./.github/actions/tf-setup
        with:
          aws-role: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          backend: "true"

      - name: Terraform plan
        run: |
          terraform -chdir=infra/terraform plan -out=tfplan
          terraform -chdir=infra/terraform show -no-color tfplan > infra/terraform/plan.txt

      - name: Comment plan on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/plan.txt', 'utf8').slice(0, 65000);
            const body = `### Terraform plan\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Upload plan artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan
          path: infra/terraform/tfplan
          retention-days: 1

  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: tf-setup
        uses: ./.github/actions/tf-setup
        with:
          aws-role: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          backend: "true"

      - name: Download plan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tfplan
          path: infra/terraform

      - name: Terraform apply
        # Safe to auto-approve: the `dev` Environment's
        # Required reviewers rule already gated this job on a human approval before it
        # started, and the plan being applied is the one `plan` computed and uploaded --
        # not one recomputed here.
        run: terraform -chdir=infra/terraform apply -auto-approve tfplan

      - name: Export scripts bucket
        id: tf
        run: |
          echo "scripts_bucket=$(terraform -chdir=infra/terraform output -raw scripts_bucket)" >> "$GITHUB_OUTPUT"

    outputs:
      scripts_bucket: ${{ steps.tf.outputs.scripts_bucket }}

  deploy:
    name: Deploy shared library and job scripts
    runs-on: ubuntu-latest
    needs: apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      SCRIPTS_BUCKET: ${{ needs.apply.outputs.scripts_bucket }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_SCRIPTS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build shared library zip
        run: |
          mkdir -p dist
          cd src && find payroll_pipeline_2026_09_17 -type f \
            ! -path "*/__pycache__/*" \
            ! -path "*/tests/*" \
            ! -path "*/jobs/*/*.yaml" \
            | grep -vE 'jobs/([^/]+)/\1\.py$' \
            | zip -q ../dist/payroll_pipeline_2026_09_17.zip -@

      - name: Upload shared library
        run: aws s3 cp dist/payroll_pipeline_2026_09_17.zip "s3://${SCRIPTS_BUCKET}/lib/payroll_pipeline_2026_09_17.zip"

      - name: Upload job scripts
        run: |
          for job_dir in src/payroll_pipeline_2026_09_17/jobs/*/; do
            job_name=$(basename "$job_dir")
            aws s3 cp "${job_dir}${job_name}.py" \
              "s3://${SCRIPTS_BUCKET}/scripts/${job_name}/${job_name}.py"
          done
