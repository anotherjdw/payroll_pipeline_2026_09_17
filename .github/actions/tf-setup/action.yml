# action.yml -- generated by pipeline-automator scaffold (project init)
# Shared setup for every Terraform-touching job in ci.yml (terraform, plan, apply):
# checkout, optionally configure AWS credentials via OIDC, install Terraform, and
# terraform init -- so those three jobs don't each repeat the same five steps.
name: tf-setup
description: Checkout, optionally assume an AWS role via OIDC, and terraform init.

inputs:
  aws-role:
    description: >-
      IAM role ARN to assume via OIDC. Leave empty to skip configuring AWS credentials
      entirely (the credential-free `terraform validate` run).
    required: false
    default: ""
  backend:
    description: >-
      "true" initializes the real S3 backend; "false" runs init -backend=false.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Configure AWS credentials
      if: inputs.aws-role != ''
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: ${{ inputs.aws-role }}
        aws-region: ${{ vars.AWS_REGION }}
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      with:
        terraform_version: "1.10.0"

    - name: Terraform init
      shell: bash
      run: |
        if [ "${{ inputs.backend }}" = "false" ]; then
          terraform -chdir=infra/terraform init -backend=false
        else
          terraform -chdir=infra/terraform init
        fi
